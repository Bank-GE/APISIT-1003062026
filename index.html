<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual">
<title>Time Card</title>
<meta name="theme-color" content="#0d0e0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Time Card">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0e0f; --panel: #151719; --panel2: #1c1f22; --line: #2a2e33; --line2: #3a3f45;
    --text: #ecebe7; --muted: #8d9196; --faint: #5f6368;
    --accent: #2f4b70; --accent-2: #40618f; --accent-hi: #8ea9cf; --on-accent: #eaf0f8;   /* น้ำเงินเข้มตุ่น (ทั่วไป) */
    --in: #3d6fd6; --in-2: #5a87e3; --on-in: #f3f6ff;                                    /* เข้า = น้ำเงิน */
    --out: #d97757; --out-2: #e48d70; --on-out: #1f100a;                                 /* ออก = ส้มแบบ Claude */
    --ok: #4fd18b; --warn: #ffc53d; --err: #ff5a5a; --flag: #ff4d4d; --done: #179a55;
    --mono: 'Share Tech Mono', ui-monospace, monospace;
    --sans: 'IBM Plex Sans Thai', system-ui, sans-serif;
    --gap: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  button { touch-action: manipulation; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans);
               -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
  body { display: flex; justify-content: center; align-items: center; }
  [hidden] { display: none !important; }

  /* ---------- main app: พอดีหนึ่งจอ ---------- */
  .app { width: 100%; max-width: 480px; height: 100vh; height: 100dvh; max-height: 900px;
         display: flex; flex-direction: column; gap: 14px; overflow: hidden;
         padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
           max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }

  .top { flex: none; display: flex; justify-content: space-between; align-items: center; gap: 14px;
         border-bottom: 1px solid var(--line); padding-bottom: 9px; }
  .top .id { font-family: var(--mono); font-size: 13px; letter-spacing: .1em; color: var(--muted);
             text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top .id b { color: var(--text); font-weight: 400; }
  .top .acts { display: flex; gap: 16px; flex: none; }
  .sync { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-left: 8px; vertical-align: 1px;
          background: var(--ok); opacity: .55; transition: background .2s, opacity .2s; }
  body[data-sync=busy] .sync { background: var(--accent-hi); opacity: 1; animation: blink 1s ease-in-out infinite; }
  body[data-sync=pending] .sync { background: var(--warn); opacity: 1; }
  @keyframes blink { 50% { opacity: .25; } }
  .top button { background: none; border: 0; color: var(--muted); font-family: var(--sans); font-size: 15px;
                cursor: pointer; padding: 9px 2px; margin: -9px -2px; }
  .top button:hover { color: var(--text); }

  .head { flex: none; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
  .clock { font-family: var(--mono); font-size: clamp(48px, 15vw, 66px); line-height: .9; white-space: nowrap; }
  .clock small { font-size: .38em; color: var(--muted); }
  .meta { display: flex; flex-direction: column; align-items: flex-end; gap: 7px; min-width: 0; }
  .date { color: var(--muted); font-size: 15px; white-space: nowrap; }
  .status { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border: 1px solid var(--line);
            border-radius: 999px; font-size: 14px; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .status.on .dot { background: var(--ok); box-shadow: 0 0 0 3px rgba(79,209,139,.18); }
  .status.break .dot { background: var(--warn); }
  .status.ot .dot { background: var(--accent-hi); box-shadow: 0 0 0 3px rgba(142,169,207,.2); }

  .label { flex: none; display: flex; justify-content: space-between; align-items: center; gap: 8px;
           font-size: 15px; color: var(--muted); margin-bottom: 8px; }
  .label > span:first-child { color: var(--text); font-weight: 500; white-space: nowrap; font-size: 16px; }
  .hrs { font-family: var(--mono); font-size: 14px; letter-spacing: .04em; white-space: nowrap; }
  .hrs b { color: var(--text); font-weight: 400; }

  /* ---------- ปุ่มลงเวลา: 2 คอลัมน์ 3 แถว (เข้า | ออก) ---------- */
  .times { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .grid { flex: 1 1 auto; min-height: 0; max-height: 480px; display: grid; gap: var(--gap);
          grid-template-columns: 1fr 1fr;
          grid-template-rows: minmax(112px, 1.45fr) minmax(66px, 1fr) minmax(66px, 1fr); }
  .tile { position: relative; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
          padding: 12px 14px; text-align: left; color: var(--text); font: inherit; cursor: pointer;
          display: flex; flex-direction: column; justify-content: flex-start; gap: 3px; overflow: hidden;
          transition: border-color .15s, background .15s, transform .05s; -webkit-tap-highlight-color: transparent;
          touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .tile:active { transform: scale(.97); }
  .tile .lab { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; min-width: 0; }
  .tile .th { font-size: 17px; font-weight: 600; white-space: nowrap; }
  .tile .en { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; color: var(--muted); white-space: nowrap;
              min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .tile.sm { container-type: inline-size; }
  @container (max-width: 168px) { .tile.sm .lab .en { display: none; } }   /* ปุ่มเล็กแคบ: แสดงแค่ภาษาไทย */
  .tile .th { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .tile.big .lab { flex-direction: column; align-items: flex-start; gap: 2px; }
  .tile.big .th { font-size: 20px; }
  .tile.big .en { font-size: 13px; order: -1; }
  .tile .t { font-family: var(--mono); font-size: 30px; line-height: 1; color: var(--faint); white-space: nowrap; margin-top: auto; }
  .tile.big .t { font-size: clamp(38px, 11vw, 50px); }
  .tile .hint { display: none; font-size: 14px; line-height: 1.3; color: var(--warn); font-weight: 600; }
  .tile.done { border-color: var(--line2); }
  .tile.done .t { color: var(--text); }
  .tile.primary.in  { background: var(--in);  border-color: var(--in-2);  color: var(--on-in); }
  .tile.primary.out { background: var(--out); border-color: var(--out-2); color: var(--on-out); }
  .tile.primary .en { color: inherit; opacity: .72; }
  .tile.primary .t { color: inherit; opacity: .9; }
  .tile.armed { border-color: var(--warn); background: #2a2412; color: var(--text); }
  .tile.armed .t { color: var(--text); }
  .tile.armed .lab { display: none; }
  .tile.armed .hint { display: block; }
  .tile.flag { border-color: rgba(255,77,77,.6); }
  .tile.flag .en { color: var(--flag); opacity: 1; }
  .tile.flag::after { content: ''; position: absolute; top: 12px; right: 12px; width: 9px; height: 9px; border-radius: 50%;
                      background: var(--flag); box-shadow: 0 0 0 3px rgba(255,77,77,.2); }
  .tile.sm.flag .lab { padding-right: 16px; }
  .tile:disabled { opacity: .55; cursor: wait; }

  /* ---------- Note ---------- */
  .tasks { flex: none; }
  .save { background: transparent; border: 1px solid var(--line2); color: var(--muted); border-radius: 999px;
          min-height: 34px; padding: 0 16px; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap; }
  .save.dirty { background: var(--text); border-color: var(--text); color: #111; font-weight: 600; }
  .save:disabled { opacity: .55; cursor: wait; }
  .task { display: flex; align-items: center; gap: 12px; background: var(--panel); border: 1px solid var(--line);
          border-radius: 12px; padding: 0 14px; }
  .task + .task { margin-top: 8px; }
  .task:focus-within { border-color: var(--accent-hi); }
  .task em { font-style: normal; font-family: var(--mono); font-size: 13px; color: var(--muted); white-space: nowrap; }
  .task input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--text); font: inherit;
                font-size: 17px; height: 48px; }
  .task input::placeholder, .field::placeholder { color: var(--faint); }

  /* ---------- shared form bits ---------- */
  .btn { padding: 12px; border-radius: 12px; border: 1px solid var(--line2); background: transparent;
         color: var(--text); font: inherit; font-weight: 600; font-size: 17px; cursor: pointer; }
  .btn.solid { background: var(--accent); border-color: var(--accent-2); color: var(--on-accent); }
  .btn.solid.in  { background: var(--in);  border-color: var(--in-2);  color: var(--on-in); }
  .btn.solid.out { background: var(--out); border-color: var(--out-2); color: var(--on-out); }
  .btn:disabled { opacity: .5; cursor: default; }
  .field { width: 100%; height: 52px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
           color: var(--text); font: inherit; font-size: 18px; padding: 0 14px; outline: 0; }
  .field:focus { border-color: var(--accent-hi); }
  .cap { display: block; font-size: 14px; color: var(--muted); margin: 16px 0 8px; }

  /* ---------- login ---------- */
  .login { position: fixed; inset: 0; z-index: 25; background: var(--bg); display: flex; align-items: center; justify-content: center;
           padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); overflow: auto; }
  .login form { width: 100%; max-width: 420px; }
  .login .brand { font-family: var(--mono); font-size: 13px; letter-spacing: .16em; color: var(--muted);
                  border-bottom: 1px solid var(--line); padding-bottom: 10px; }
  .login .clock { margin: 22px 0 6px; }
  .login .ldate { font-size: 15px; }
  .login h1 { font-size: 24px; font-weight: 600; margin: 24px 0 4px; }
  .login p { color: var(--muted); font-size: 15px; }
  .login .btn { width: 100%; margin-top: 20px; height: 54px; }
  .login .msg { min-height: 22px; margin-top: 12px; font-size: 15px; color: var(--err); }

  /* ---------- popup ---------- */
  .modal { position: fixed; inset: 0; z-index: 30; display: none; background: rgba(0,0,0,.62);
           -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
           padding: calc(max(12px, env(safe-area-inset-top)) + 6px) 12px max(12px, env(safe-area-inset-bottom)); }
  .modal.show { display: flex; justify-content: center; align-items: flex-start; }
  .sheet { width: 100%; max-width: 456px; max-height: 100%; overflow: auto; background: var(--panel);
           border: 1px solid var(--line2); border-radius: 18px; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 14px;
           animation: pop .16s ease-out; }
  @keyframes pop { from { transform: translateY(-8px); opacity: 0; } }
  .sheet .kicker { font-family: var(--mono); font-size: 13px; letter-spacing: .12em; color: var(--muted); }
  .sheet h3 { font-size: 22px; font-weight: 600; margin-top: 2px; }
  .sheet .actions { display: flex; gap: 10px; position: sticky; bottom: -16px; margin: 0 -16px -16px; padding: 12px 16px 16px;
                    background: var(--panel); border-top: 1px solid var(--line); z-index: 2; }
  .sheet .actions .btn { flex: 1; height: 56px; }
  .sheet .actions .btn.solid { flex: 1.6; }

  .locbox { border: 1px solid var(--line2); border-radius: 14px; padding: 14px; display: flex; gap: 12px; align-items: flex-start; }
  .locbox .ic { flex: none; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
                font-size: 19px; font-weight: 600; background: var(--line); }
  .locbox b { display: block; font-size: 17px; font-weight: 600; }
  .locbox span { display: block; font-size: 15px; color: var(--muted); margin-top: 3px; line-height: 1.45; }
  .locbox a { color: var(--muted); font-size: 14px; }
  .locbox.in  { border-color: rgba(79,209,139,.5); }  .locbox.in .ic  { background: rgba(79,209,139,.16); color: var(--ok); }
  .locbox.out { border-color: rgba(255,77,77,.55); }  .locbox.out .ic { background: rgba(255,77,77,.16); color: var(--flag); }
  .locbox.warn { border-color: rgba(255,197,61,.5); } .locbox.warn .ic { background: rgba(255,197,61,.14); color: var(--warn); }
  .spin { width: 20px; height: 20px; border: 2px solid var(--line2); border-top-color: var(--text); border-radius: 50%;
          animation: rot .8s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }
  .linkbtn { background: none; border: 0; color: var(--text); text-decoration: underline; font: inherit; font-size: 15px;
             cursor: pointer; padding: 0; margin-top: 6px; }
  .reason { margin-top: 12px; }
  .latewarn { border: 1px solid rgba(255,197,61,.55); background: rgba(255,197,61,.1); color: var(--warn); border-radius: 14px;
              padding: 12px 14px; font-size: 16px; font-weight: 600; line-height: 1.4; }

  /* ---------- ยอดผลิต ---------- */
  .prows { display: flex; flex-direction: column; gap: 10px; }
  .prow .pgrid { display: grid; grid-template-columns: 1fr 76px 90px 44px; gap: 6px; }
  .prow .field { padding: 0 10px; font-family: var(--mono); font-size: 20px; }
  .prow .field.pre { color: var(--muted); }            /* ค่าล่าสุดที่เติมให้ — ยังไม่ได้แก้ */
  .prow .qty { text-align: right; }
  .prow .mc { text-align: center; }
  .prow.err .field { border-color: var(--err); }
  .prow .x { height: 52px; border-radius: 12px; border: 1px solid var(--line); background: transparent; color: var(--muted);
             font-size: 20px; cursor: pointer; }
  .pcap { display: grid; grid-template-columns: 1fr 76px 90px 44px; gap: 6px; font-size: 13px; color: var(--muted); padding: 0 4px; }
  .pcap span:nth-child(2) { text-align: center; } .pcap span:nth-child(3) { text-align: right; padding-right: 8px; }
  .sugg { margin-top: 6px; border: 1px solid var(--line2); border-radius: 12px; background: var(--panel2); overflow: hidden; }
  .sugg button { display: block; width: 100%; text-align: left; height: 46px; padding: 0 14px; border: 0; background: none;
                 color: var(--text); font-family: var(--mono); font-size: 19px; cursor: pointer; }
  .sugg button + button { border-top: 1px solid var(--line); }
  .sugg button:active { background: var(--line); }
  .sugg mark { background: none; color: var(--accent-hi); }
  .addrow { height: 48px; border-radius: 12px; border: 1px dashed var(--line2); background: transparent; color: var(--muted);
            font: inherit; font-size: 16px; cursor: pointer; }
  .ptotal { display: flex; justify-content: space-between; align-items: baseline; font-size: 15px; color: var(--muted); }
  .ptotal b { font-family: var(--mono); font-size: 24px; font-weight: 400; color: var(--text); }
  .pmsg { font-size: 15px; color: var(--err); min-height: 0; }

  /* ---------- ยืนยันบันทึกแล้ว (เขียวเต็มจอ ~2 วินาที) ---------- */
  .okscr { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; text-align: center;
          background: var(--done); color: #fff; opacity: 0; pointer-events: none; transition: opacity .18s ease-out;
          padding: 24px; }
  .okscr.show { opacity: 1; pointer-events: auto; }
  .okscr.hide { opacity: 0; transition: opacity .45s ease-in; }
  .okscr .ck { width: 112px; height: 112px; border-radius: 50%; border: 5px solid rgba(255,255,255,.9); margin: 0 auto 22px;
              display: grid; place-items: center; font-size: 62px; line-height: 1; transform: scale(.7); transition: transform .3s cubic-bezier(.2,1.6,.4,1); }
  .okscr.show .ck { transform: scale(1); }
  .okscr b { display: block; font-size: 30px; font-weight: 600; }
  .okscr .dt { font-family: var(--mono); font-size: 76px; line-height: 1.05; margin-top: 6px; }
  .okscr .ds { font-size: 18px; opacity: .92; margin-top: 10px; }
  .okscr .pill { display: inline-block; margin-top: 14px; padding: 8px 16px; border-radius: 999px; font-size: 17px; font-weight: 600;
                background: rgba(0,0,0,.22); }
  .okscr .pill.warn { background: #ffd35a; color: #2a1d00; }

  .toast { position: fixed; left: 50%; top: calc(max(12px, env(safe-area-inset-top)) + 4px); z-index: 70;
           transform: translate(-50%, -20px); opacity: 0; background: var(--text); color: #111; padding: 12px 18px;
           border-radius: 12px; font-size: 16px; transition: all .2s; pointer-events: none; max-width: calc(100% - 32px); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.err { background: var(--err); color: #fff; }
  .toast.warn { background: var(--warn); color: #111; }

  @media (max-width: 370px) {
    .brandtxt { display: none; }
    .top .id { font-size: 12px; letter-spacing: .06em; }
    .top button { font-size: 14px; }
    .hrs { font-size: 13px; letter-spacing: 0; }
    .tile { padding: 10px 11px; }
    .tile .th { font-size: 15px; }
    .tile .en { font-size: 11px; letter-spacing: .02em; }
    .tile.big .th { font-size: 18px; }
    .tile .t { font-size: 26px; }
    .prow .pgrid, .pcap { grid-template-columns: 1fr 64px 76px 40px; }
  }
  /* จอเตี้ย (iPhone SE / Android เล็ก) — กระชับระยะห่างให้ยังอยู่ในจอเดียว */
  @media (max-height: 640px) {
    .app { gap: 10px; padding-top: max(8px, env(safe-area-inset-top)); padding-bottom: max(8px, env(safe-area-inset-bottom)); }
    .top { padding-bottom: 7px; }
    .clock { font-size: clamp(42px, 13vw, 54px); }
    .label { margin-bottom: 6px; }
    .grid { --gap: 8px; grid-template-rows: minmax(96px, 1.45fr) minmax(58px, 1fr) minmax(58px, 1fr); }
    .tile.big .t { font-size: clamp(34px, 10vw, 44px); }
    .tile .t { font-size: 26px; }
    .task input { height: 44px; }
    .task + .task { margin-top: 6px; }
  }
  @media (max-height: 520px) {
    .app { gap: 8px; }
    .head .status { padding: 3px 10px; font-size: 13px; }
    .clock { font-size: 40px; }
    .grid { grid-template-rows: minmax(84px, 1.4fr) minmax(52px, 1fr) minmax(52px, 1fr); }
    .tile { padding: 8px 11px; }
    .tile.big .th { font-size: 17px; }
    .tile.big .t { font-size: 34px; }
    .tile .t { font-size: 23px; }
    .task input { height: 40px; font-size: 16px; }
    .label { margin-bottom: 4px; }
  }
  @media (max-height: 420px) {
    .app { height: auto; max-height: none; overflow: visible; }
    .times, .grid { flex: none; }
    .grid { grid-template-rows: 96px 60px 60px; }
    body { align-items: flex-start; }
  }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div class="login" id="login" hidden>
  <form id="loginForm" autocomplete="on" novalidate>
    <div class="brand">TIME CARD</div>
    <div class="clock"><span class="lhm">--:--</span><small class="lss">:--</small></div>
    <p class="ldate"></p>
    <h1>เข้าสู่ระบบ</h1>
    <p>ใช้รหัสพนักงานและ PIN ที่ได้รับ</p>
    <label class="cap" for="empId">รหัสพนักงาน</label>
    <input class="field" id="empId" name="username" autocomplete="username" autocapitalize="characters" spellcheck="false" required>
    <label class="cap" for="pin">PIN</label>
    <input class="field" id="pin" name="password" type="password" inputmode="numeric" autocomplete="current-password" required>
    <button class="btn solid" type="submit" id="loginBtn">เข้าสู่ระบบ</button>
    <div class="msg" id="loginMsg"></div>
  </form>
</div>

<!-- ============ MAIN ============ -->
<main class="app" id="app" hidden>
  <div class="top">
    <span class="id"><span class="brandtxt">Time Card · </span><b id="empName">—</b><i class="sync" id="sync"></i></span>
    <span class="acts"><button id="refresh">รีเฟรช</button><button id="logout">ออกจากระบบ</button></span>
  </div>

  <div class="head">
    <div class="clock"><span id="hm">--:--</span><small id="ss">:--</small></div>
    <div class="meta">
      <div class="date" id="today"></div>
      <div class="status" id="status"><span class="dot"></span><span id="statusText">กำลังโหลด…</span></div>
    </div>
  </div>

  <section class="times">
    <div class="label"><span>บันทึกเวลา</span><span class="hrs">WORK <b id="workHr">0.00</b> · OT <b id="otHr">0.00</b><span id="pcsWrap" hidden> · <b id="pcs">0</b> PCS</span></span></div>
    <div class="grid">
      <button class="tile big in"  data-key="checkIn"><span class="lab"><span class="th">เข้างาน</span><span class="en">CHECK IN</span></span><span class="hint"></span><span class="t">--:--</span></button>
      <button class="tile big out" data-key="checkOut"><span class="lab"><span class="th">ออกงาน</span><span class="en">CHECK OUT</span></span><span class="hint"></span><span class="t">--:--</span></button>
      <button class="tile sm out"  data-key="breakOut"><span class="lab"><span class="th">พักเบรก</span><span class="en">BREAK OUT</span></span><span class="hint"></span><span class="t">--:--</span></button>
      <button class="tile sm in"   data-key="breakIn"><span class="lab"><span class="th">กลับจากพัก</span><span class="en">BREAK IN</span></span><span class="hint"></span><span class="t">--:--</span></button>
      <button class="tile sm in"   data-key="otIn"><span class="lab"><span class="th">เริ่ม OT</span><span class="en">OT IN</span></span><span class="hint"></span><span class="t">--:--</span></button>
      <button class="tile sm out"  data-key="otOut"><span class="lab"><span class="th">เลิก OT</span><span class="en">OT OUT</span></span><span class="hint"></span><span class="t">--:--</span></button>
    </div>
  </section>

  <section class="tasks">
    <div class="label"><span>Note</span><button class="save" id="save" title="ถ้าไม่ได้กด ระบบจะบันทึกให้อัตโนมัติตอนกดลงเวลา">บันทึก</button></div>
    <label class="task"><em>NOTE 1</em><input id="n1" list="sugg" placeholder="หมายเหตุ (ถ้ามี)" autocomplete="off" enterkeyhint="next"></label>
    <label class="task"><em>NOTE 2</em><input id="n2" list="sugg" placeholder="หมายเหตุ (ถ้ามี)" autocomplete="off" enterkeyhint="done"></label>
    <datalist id="sugg"></datalist>
      </section>
</main>

<!-- ============ POPUP ============ -->
<div class="modal" id="modal">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div><div class="kicker" id="mKicker"></div><h3 id="mTitle"></h3></div>
    <div id="mBody"></div>
    <div class="actions">
      <button class="btn" type="button" id="mCancel">ยกเลิก</button>
      <button class="btn solid" type="button" id="mOk">บันทึกเวลา</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="okscr" id="done" aria-live="polite"><div><div class="ck">✓</div><b id="doneTitle"></b><div class="dt" id="doneTime"></div><div class="ds" id="doneSub"></div><div id="donePills"></div></div></div>

<script>
  /* ================== CONFIG ================== */
  // ← ใส่ Web app URL ของ Apps Script (ลงท้ายด้วย /exec)
  var API_URL = 'https://script.google.com/macros/s/AKfycbzHAtrQ5fk6w2oRMx8eUUv0KKVwtx6z4W48wzmCuXzESpNnkhLGwCeLXs6Bny4BQwZPqQ/exec';

  /* ================== constants ================== */
  var ARRIVE = ['checkIn', 'breakIn', 'otIn'];      // ตอนเข้า → เช็คพิกัด · ตอนออก → เช็คพิกัด + ยอดผลิต
  var EVENT = { checkIn: 'Check In', breakOut: 'Break Out', breakIn: 'Break In', checkOut: 'Check Out', otIn: 'OT In', otOut: 'OT Out' };
  var TH = { checkIn: 'เข้างาน', breakOut: 'พักเบรก', breakIn: 'กลับจากพัก', checkOut: 'ออกงาน', otIn: 'เริ่ม OT', otOut: 'เลิก OT' };

  var state = null, armed = null, armTimer = null, busy = false, dirty = false;
  var $ = function (s) { return document.querySelector(s); };
  var tiles = Array.prototype.slice.call(document.querySelectorAll('.tile'));
  var inputs = [$('#n1'), $('#n2')];

  function pad(n) { return ('0' + n).slice(-2); }
  function fmt(v) {
    if (!v) return '--:--';
    var p = String(v).split(':');
    return p.length >= 2 ? pad(Number(p[0])) + ':' + p[1] : v;
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function errMsg(e) { return (e && e.message) ? e.message : String(e); }
  function nowHM() { var d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }

  /* ================== session (localStorage + cookie สำรอง) ================== */
  var SKEY = 'timecard.session';
  function b64e(s) { return btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
  function b64d(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return decodeURIComponent(escape(atob(s))); }
  function loadSession() {
    try { var j = JSON.parse(localStorage.getItem(SKEY)); if (j && j.token) return j; } catch (e) {}
    try { var m = document.cookie.match(/(?:^|; )tcs=([^;]+)/); if (m) { var c = JSON.parse(b64d(m[1])); if (c && c.token) return c; } } catch (e) {}
    return null;
  }
  function saveSession(s) {
    try { if (s) localStorage.setItem(SKEY, JSON.stringify(s)); else localStorage.removeItem(SKEY); } catch (e) {}
    try { document.cookie = 'tcs=' + (s ? b64e(JSON.stringify(s)) : '') + '; Max-Age=' + (s ? 34560000 : 0) + '; Path=/; SameSite=Lax; Secure'; } catch (e) {}
  }
  var session = loadSession();

  function apiUrl() {
    if (/^https:\/\/script\.google\.com\/.+\/exec\/?$/.test(API_URL)) return API_URL;
    try { var old = JSON.parse(localStorage.getItem('timecard.cfg')); if (old && old.url) return old.url; } catch (e) {} // ค่าจากเวอร์ชันเก่า
    return '';
  }

  /* ================== API ================== */
  /**
   * เรียก API — ถ้า Google ตอบกลับผิดพลาดชั่วคราว (คนใช้พร้อมกันเยอะ / เซิร์ฟเวอร์ช้า / เน็ตสะดุด)
   * จะลองใหม่เองอัตโนมัติสูงสุด 3 ครั้ง ผู้ใช้ไม่ต้องกดซ้ำ
   */
  var TRANSIENT = /timed? ?out|timeout|too many|simultaneous|unavailable|try again|server error|service|lock|quota|internal|busy|ยุ่ง/i;
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function softErr(msg) { var e = new Error(msg); e.transient = true; return e; }

  function apiOnce(url, body) {
    var ctl = window.AbortController ? new AbortController() : null;
    var timer = ctl ? setTimeout(function () { ctl.abort(); }, 25000) : null;
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body),
      redirect: 'follow',
      keepalive: body.action === 'stamp' || body.action === 'saveNotes',   // ปิดแอประหว่างส่ง ก็ยังส่งต่อจนจบ
      signal: ctl ? ctl.signal : undefined
    }).then(function (r) {
      return r.text().then(function (txt) { return { status: r.status, txt: txt }; });
    }, function (e) {
      throw softErr(e && e.name === 'AbortError' ? 'เซิร์ฟเวอร์ตอบช้าเกินไป' : 'เชื่อมต่อไม่ได้ — ตรวจอินเทอร์เน็ต หรือการ Deploy (Who has access: Anyone)');
    }).then(function (x) {
      var d;
      try { d = JSON.parse(x.txt); } catch (e) {
        if (/doPost/.test(x.txt)) throw new Error('Apps Script ยังเป็นโค้ดเก่า — วาง Code.gs ใหม่ แล้ว Deploy เป็น New version');
        throw softErr('เซิร์ฟเวอร์ Google ไม่ว่างชั่วคราว (HTTP ' + x.status + ')');
      }
      if (d.error === 'unauthorized') { logout('กรุณาเข้าสู่ระบบอีกครั้ง'); throw new Error('ต้องเข้าสู่ระบบใหม่'); }
      if (d.error) { var e2 = new Error(d.error); e2.transient = TRANSIENT.test(d.error); throw e2; }
      return d;
    }).then(function (d) { if (timer) clearTimeout(timer); return d; }, function (e) { if (timer) clearTimeout(timer); throw e; });
  }

  function api(body, onRetry) {
    var url = apiUrl();
    if (!url) return Promise.reject(new Error('ยังไม่ได้ใส่ API_URL ในไฟล์ index.html'));
    if (body.action !== 'login') body.token = session && session.token;
    var attempt = 0, MAX = 4;
    function run() {
      attempt++;
      return apiOnce(url, body).then(function (d) { d._attempts = attempt; return d; }, function (e) {
        if (!e.transient || attempt >= MAX) throw e;
        if (onRetry) onRetry(attempt + 1, MAX);
        return wait([0, 600, 1500, 3000][attempt] + Math.random() * 1000).then(run);   // เว้นจังหวะไม่ให้ทุกคนยิงซ้ำพร้อมกัน
      });
    }
    return run();
  }

  /* ================== toast ================== */
  function toast(msg, kind) {
    var t = $('#toast');
    t.textContent = msg;
    t.className = 'toast show' + (kind ? ' ' + kind : '');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.className = 'toast'; }, kind ? 5500 : 2400);
  }

  /* ================== clock ================== */
  function tick() {
    var d = new Date(), hm = pad(d.getHours()) + ':' + pad(d.getMinutes()), ss = ':' + pad(d.getSeconds());
    var date = d.toLocaleDateString('th-TH', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
    $('#hm').textContent = hm; $('#ss').textContent = ss; $('#today').textContent = date;
    $('.lhm').textContent = hm; $('.lss').textContent = ss; $('.ldate').textContent = date;
  }

  /* ================== render ================== */
  function statusOf(t) {
    if (t.otIn && !t.otOut) return ['ot', 'กำลังทำ OT'];
    if (t.checkOut || t.otOut) return ['', 'เลิกงานแล้ว'];
    if (t.breakOut && !t.breakIn) return ['break', 'พักเบรก'];
    if (t.checkIn) return ['on', 'กำลังทำงาน'];
    return ['', 'ยังไม่เข้างาน'];
  }

  function renderSave() {
    var hasNotes = state && (state.notes || []).some(function (x) { return x; });
    $('#save').classList.toggle('dirty', dirty);
    $('#save').textContent = !dirty && hasNotes ? 'บันทึกแล้ว ✓' : 'บันทึก';
    $('#save').disabled = busy;
  }

  function fillList(id, arr) {
    $(id).innerHTML = (arr || []).map(function (x) { return '<option value="' + esc(x) + '">'; }).join('');
  }

  function render(s) {
    state = s;
    var t = s.times, f = s.flags || {};
    var primary = !t.checkIn ? 'checkIn'
      : (t.breakOut && !t.breakIn && !t.checkOut) ? 'breakIn'
      : (t.otIn && !t.otOut) ? 'otOut'
      : !t.checkOut ? 'checkOut' : null;
    tiles.forEach(function (el) {
      var k = el.dataset.key;
      el.querySelector('.t').textContent = fmt(t[k]);
      el.classList.toggle('done', !!t[k]);
      el.classList.toggle('primary', k === primary && armed !== k);
      el.classList.toggle('armed', armed === k);
      el.classList.toggle('flag', !!f[k]);
      el.title = f[k] || '';
      el.querySelector('.hint').textContent = t[k] ? 'แตะอีกครั้งเพื่อแก้เวลา'
        : k === 'otIn' ? 'แตะอีกครั้งเพื่อเริ่ม OT' : k === 'otOut' ? 'แตะอีกครั้งเพื่อเลิก OT' : '';
      el.disabled = busy;
    });
    var st = statusOf(t);
    $('#status').className = 'status ' + st[0];
    $('#statusText').textContent = st[1];
    $('#workHr').textContent = s.workHr || '0.00';
    $('#otHr').textContent = s.otHr || '0.00';
    var pcs = (s.prod || []).reduce(function (a, x) { return a + (Number(x.qty) || 0); }, 0);
    $('#pcsWrap').hidden = !pcs;
    $('#pcs').textContent = pcs.toLocaleString();
    if (s.emp) $('#empName').textContent = s.emp.name;
    if (!dirty) inputs.forEach(function (inp, i) { inp.value = (s.notes || [])[i] || ''; });
    fillList('#sugg', s.suggestions);
    renderSave();
  }

  function setBusy(b) { busy = b; if (state) render(state); else renderSave(); }
  function getNotes() { return inputs.map(function (i) { return i.value.trim(); }); }

  /* ================== ข้อมูลในเครื่อง: เปิดแอปเห็นข้อมูลทันที แล้วค่อยซิงค์เบื้องหลัง ================== */
  var FIELDS = ['checkIn', 'breakOut', 'breakIn', 'checkOut', 'otIn', 'otOut'];
  function todayStr() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  function lsSet(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function empKey(p) { return 'timecard.' + p + '.' + (session && session.emp ? session.emp.id : ''); }
  function rid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  var serverState = null;   // ข้อมูลล่าสุดที่ยืนยันจาก Google แล้ว
  var queue = [];           // รายการที่กดแล้วแต่ยังส่งไม่ถึง Google (เก็บในเครื่อง ปิดแอปก็ไม่หาย)
  var gen = 0;              // กันข้อมูลเก่าที่โหลดมาช้า ทับข้อมูลใหม่

  function blankDay(s) {
    var d = clone(s); d.date = todayStr(); d.row = -1; d.times = {}; d.flags = {};
    FIELDS.forEach(function (k) { d.times[k] = ''; d.flags[k] = ''; });
    d.notes = ['', '']; d.prod = []; d.workHr = ''; d.otHr = '';
    return d;
  }
  function cachedState() {
    var c = lsGet(empKey('state'));
    if (!c || !c.times) return null;
    return c.date === todayStr() ? c : blankDay(c);
  }
  function loadQueue() { queue = lsGet(empKey('queue')) || []; }
  function saveQueue() { lsSet(empKey('queue'), queue.length ? queue : null); }

  /** ข้อมูลจาก Google + รายการที่ยังรอส่ง = สิ่งที่ผู้ใช้ควรเห็น */
  function withPending(s) {
    if (!s || !queue.length) return s;
    s = clone(s);
    queue.forEach(function (q) {
      if (q.date !== s.date) return;
      if (q.kind === 'stamp') {
        s.times[q.key] = q.hm; s.flags[q.key] = q.flag || '';
        if (q.body.prod) s.prod = (s.prod || []).filter(function (x) { return x.event !== EVENT[q.key]; })
          .concat(q.body.prod.map(function (p) { return { event: EVENT[q.key], model: p.model, mc: p.mc, qty: p.qty }; }));
      }
      if (q.body.notes) s.notes = q.body.notes.slice();
    });
    return s;
  }
  function show() { if (serverState) render(withPending(serverState)); }
  function applyServer(s) { serverState = s; lsSet(empKey('state'), s); show(); }

  function setSync() {
    document.body.dataset.sync = (flushing || refreshing) ? 'busy' : queue.length ? 'pending' : 'idle';
    $('#sync').title = queue.length ? 'รอส่ง ' + queue.length + ' รายการ' : (flushing || refreshing) ? 'กำลังซิงค์…' : 'ซิงค์แล้ว';
  }

  /** ส่งรายการที่รอทีละรายการ ตามลำดับที่กด */
  var flushing = false, flushTimer = null;
  function flush() {
    if (flushing || !queue.length || !session) return Promise.resolve();
    flushing = true; setSync();
    var q = queue[0];
    return api(clone(q.body)).then(function (r) {
      queue.shift(); saveQueue(); gen++;
      if (q.kind === 'stamp') {
        if (r.exists && !r.dup && r._attempts === 1) toast(TH[q.key] + ' — มีเวลาบันทึกไว้แล้ว ' + fmt(r.state.times[q.key]), 'err');
        else if (r.check && /out|noloc/.test(r.check.status) && !q.flag) toast(TH[q.key] + ' — ' + (r.check.status === 'out' ? 'นอกพื้นที่' : 'ไม่มีพิกัด') + ' ติดธงแดง', 'warn');
      }
      applyServer(r.state);
    }, function (e) {
      if (e.transient) {
        if (!q.warned) { q.warned = true; saveQueue(); toast('เน็ต/Google ไม่ว่าง — เก็บไว้ในเครื่องแล้ว จะส่งให้อัตโนมัติ', 'warn'); }
        clearTimeout(flushTimer); flushTimer = setTimeout(flush, 10000);
      } else if (session) {
        queue.shift(); saveQueue();
        toast('บันทึกไม่สำเร็จ: ' + errMsg(e), 'err');
        refresh(true);
      }
      throw e;
    }).then(function () { flushing = false; setSync(); return flush(); }, function () { flushing = false; setSync(); show(); });
  }

  /** โหลดข้อมูลล่าสุดจาก Google เบื้องหลัง — หน้าจอไม่ต้องรอ */
  var refreshing = false;
  function refresh(manual) {
    if (!session || refreshing) return Promise.resolve();
    refreshing = true; setSync();
    var g = gen;
    if (!serverState) $('#statusText').textContent = 'กำลังโหลด…';
    return api({ action: 'state' }).then(function (d) {
      if (g === gen) applyServer(d.state);        // ถ้าระหว่างโหลดมีการบันทึกใหม่ ใช้ข้อมูลของการบันทึกแทน
    }, function (e) {
      if (!session) return;
      if (!serverState) $('#statusText').textContent = 'โหลดไม่สำเร็จ — กดรีเฟรช';
      if (manual || !serverState) toast('โหลดข้อมูลไม่สำเร็จ: ' + errMsg(e), 'err');
    }).then(function () { refreshing = false; setSync(); });
  }

  /** ปลุกสคริปต์ Google ไว้ก่อน (ระหว่างที่ผู้ใช้กำลังพิมพ์ PIN) */
  function prewarm() {
    var url = apiUrl();
    if (url) { try { fetch(url, { mode: 'no-cors', cache: 'no-store' }).catch(function () {}); } catch (e) {} }
  }

  function startSession() {
    loadQueue();
    serverState = cachedState();
    show();
    setSync();
    refresh();
    flush();
    maybeStartGeo();
  }

  /* ================== login / logout ================== */
  function showLogin(msg) {
    $('#app').hidden = true;
    $('#login').hidden = false;
    $('#loginMsg').textContent = msg || '';
    try { $('#empId').value = localStorage.getItem('timecard.lastEmp') || ''; } catch (e) {}
    setTimeout(function () { ($('#empId').value ? $('#pin') : $('#empId')).focus(); }, 50);
    prewarm();
  }
  function showApp() {
    $('#login').hidden = true;
    $('#app').hidden = false;
    if (session && session.emp) $('#empName').textContent = session.emp.name;
  }
  function logout(msg) {
    session = null; state = null; serverState = null; queue = []; dirty = false;
    saveSession(null);
    closeModal();
    stopGeoWatch();
    $('#pin').value = '';
    setSync();
    showLogin(msg);
  }

  $('#loginForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var id = $('#empId').value.trim(), pin = $('#pin').value.trim();
    if (!id || !pin) { $('#loginMsg').textContent = 'กรอกรหัสพนักงานและ PIN'; return; }
    $('#loginBtn').disabled = true; $('#loginBtn').textContent = 'กำลังเข้าสู่ระบบ…'; $('#loginMsg').textContent = '';
    api({ action: 'login', empId: id, pin: pin }, function (n, max) { $('#loginBtn').textContent = 'กำลังเข้าสู่ระบบ… ลองใหม่ ' + n + '/' + max; }).then(function (d) {
      session = { token: d.token, emp: d.emp };
      saveSession(session);
      try { localStorage.setItem('timecard.lastEmp', d.emp.id); } catch (e) {}
      $('#pin').value = '';
      showApp();
      loadQueue();
      serverState = cachedState();
      if (d.state) applyServer(d.state); else { show(); refresh(); }   // ล็อกอินได้ข้อมูลวันนี้มาด้วยเลย (รอบเดียว)
      setSync(); flush(); maybeStartGeo();
    }).catch(function (e) {
      $('#loginMsg').textContent = errMsg(e);
    }).then(function () {
      $('#loginBtn').disabled = false; $('#loginBtn').textContent = 'เข้าสู่ระบบ';
    });
  });

  /* ================== GPS พร้อมไว้ล่วงหน้า ================== */
  var geoFix = null, geoWatch = null;
  function startGeoWatch() {
    if (geoWatch != null || !navigator.geolocation || document.hidden) return;
    geoWatch = navigator.geolocation.watchPosition(function (p) {
      geoFix = { lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy || 0), t: Date.now() };
    }, function () {}, { enableHighAccuracy: true, maximumAge: 10000, timeout: 30000 });
  }
  function stopGeoWatch() { if (geoWatch != null) { navigator.geolocation.clearWatch(geoWatch); geoWatch = null; } }
  /** เริ่มหาตำแหน่งตอนเปิดแอปเฉพาะเมื่อเคยอนุญาตแล้ว (จะไม่เด้งถามสิทธิ์เอง) */
  function maybeStartGeo() {
    if (!navigator.permissions || !navigator.permissions.query) return;
    navigator.permissions.query({ name: 'geolocation' }).then(function (r) { if (r.state === 'granted') startGeoWatch(); }, function () {});
  }

  /* ================== popup ================== */
  var modal = { onOk: null };
  function openModal(o) {
    $('#mKicker').textContent = o.kicker || '';
    $('#mTitle').textContent = o.title;
    $('#mBody').innerHTML = '';
    $('#mBody').appendChild(o.body);
    setOk(o.okText || 'บันทึกเวลา', false);
    $('#mOk').classList.toggle('in', o.tone === 'in');
    $('#mOk').classList.toggle('out', o.tone === 'out');
    modal.onOk = o.onOk;
    $('#toast').className = 'toast'; // ไม่ให้ข้อความเก่าบังหัวหน้าต่าง
    $('#modal').classList.add('show');
  }
  function closeModal() { $('#modal').classList.remove('show'); modal.onOk = null; }
  function setOk(text, disabled) { $('#mOk').textContent = text; $('#mOk').disabled = !!disabled; }
  $('#mCancel').addEventListener('click', closeModal);
  $('#modal').addEventListener('click', function (ev) { if (ev.target === $('#modal') && !$('#mOk').disabled) closeModal(); });
  $('#mOk').addEventListener('click', function () { if (modal.onOk) modal.onOk(); });

  /* ---------- พิกัด ---------- */
  function dist(a, b, c, d) {
    var R = 6371000, r = Math.PI / 180, x = (c - a) * r, y = (d - b) * r;
    var h = Math.sin(x / 2) * Math.sin(x / 2) + Math.cos(a * r) * Math.cos(c * r) * Math.sin(y / 2) * Math.sin(y / 2);
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
  }
  function fmtDist(m) { return m >= 1000 ? (m / 1000).toFixed(1) + ' กม.' : Math.round(m) + ' ม.'; }
  function judge(loc) {
    var sites = (state && state.sites) || [];
    if (!sites.length) return { status: 'nosite' };
    var best = null;
    sites.forEach(function (s) { var d = dist(loc.lat, loc.lng, s.lat, s.lng); if (!best || d < best.dist) best = { site: s.name, dist: d, radius: s.radius }; });
    best.status = best.dist - Math.min(loc.acc || 0, 150) <= best.radius ? 'in' : 'out';
    return best;
  }
  function geoError(e) {
    if (!e) return 'อุปกรณ์ไม่รองรับการหาตำแหน่ง';
    if (e.code === 1) return 'ไม่ได้อนุญาตให้เข้าถึงตำแหน่ง';
    if (e.code === 3) return 'หาตำแหน่งนานเกินไป';
    return 'หาตำแหน่งไม่ได้';
  }

  /** กล่องตรวจตำแหน่ง ใช้ได้ทุกหน้าต่าง — onChange(ready) ถูกเรียกเมื่อเริ่มหา (false) และเมื่อได้ผล (true) */
  function locWidget(host, onChange) {
    var fix = { loc: null, err: '', ready: false };
    var box = document.createElement('div');
    var rs = document.createElement('div');
    rs.className = 'reason';
    rs.hidden = true;
    rs.innerHTML = '<input class="field rin" maxlength="200" placeholder="ใส่เหตุผลการลงเวลานอกสถานที่" autocomplete="off" enterkeyhint="done">';
    host.appendChild(box);
    host.appendChild(rs);
    var rin = rs.querySelector('.rin');
    rin.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); rin.blur(); } });
    function needReason(on) { rs.hidden = !on; }
    function show(cls, icon, title, sub, extra) {
      box.className = 'locbox ' + cls;
      box.innerHTML = '<div class="ic">' + icon + '</div><div><b>' + esc(title) + '</b><span>' + sub + '</span>' + (extra || '') + '</div>';
      var rb = box.querySelector('.retry');
      if (rb) rb.addEventListener('click', locate);
    }
    var retry = '<button type="button" class="linkbtn retry">หาตำแหน่งใหม่</button>';
    function done() { fix.ready = true; onChange(true); }
    function locate(ev) {
      fix.loc = null; fix.err = ''; fix.ready = false; onChange(false); needReason(false);
      if (ev) geoFix = null;                                   // กด "หาตำแหน่งใหม่" = บังคับหาใหม่
      if (geoFix && Date.now() - geoFix.t < 30000 && geoFix.acc <= 150) {   // มีตำแหน่งสด ๆ อยู่แล้ว → แสดงทันที
        return ok({ coords: { latitude: geoFix.lat, longitude: geoFix.lng, accuracy: geoFix.acc } });
      }
      show('', '<div class="spin"></div>', 'กำลังหาตำแหน่ง…', 'กรุณาอนุญาตการเข้าถึงตำแหน่งถ้ามีหน้าต่างถาม');
      if (!navigator.geolocation) return fail(null);
      navigator.geolocation.getCurrentPosition(function (p) { startGeoWatch(); ok(p); }, fail, { enableHighAccuracy: true, timeout: 12000, maximumAge: 10000 });
    }
    function ok(p) {
      if (!$('#modal').classList.contains('show')) return;
      fix.loc = { lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy || 0) };
      var j = judge(fix.loc);
      var map = '<a href="https://maps.google.com/?q=' + fix.loc.lat + ',' + fix.loc.lng + '" target="_blank" rel="noopener">ดูตำแหน่งบนแผนที่</a>';
      var accTxt = 'ความแม่นยำ ±' + fix.loc.acc + ' ม.';
      if (j.status === 'in') show('in', '✓', 'อยู่ในพื้นที่ · ' + j.site, 'ห่าง ' + fmtDist(j.dist) + ' · ' + accTxt, map);
      else if (j.status === 'out') show('out', '!', 'อยู่นอกพื้นที่', 'ห่าง ' + fmtDist(j.dist) + ' จาก ' + esc(j.site) + ' · ' + accTxt + '<br>บันทึกได้ แต่จะติดธงแดงในชีต', map + ' · ' + retry);
      else show('warn', '!', 'ยังไม่ได้ตั้งพิกัดโรงงาน', 'ผู้ดูแลต้องกรอกพิกัดในแท็บ Sites ระบบจึงจะเช็คพื้นที่ได้ — ตอนนี้บันทึกตำแหน่งไว้อย่างเดียว', map);
      needReason(j.status === 'out');
      done();
    }
    function fail(e) {
      if (!$('#modal').classList.contains('show')) return;
      fix.err = geoError(e);
      var noSite = !(state && state.sites && state.sites.length);
      show('warn', '!', fix.err,
        e && e.code === 1 ? 'เปิดได้ที่ ตั้งค่า › ความเป็นส่วนตัว › บริการหาตำแหน่ง › Safari' : 'ลองออกไปที่โล่ง หรือกดหาตำแหน่งใหม่',
        '<span>' + (noSite ? 'บันทึกได้ตามปกติ' : 'บันทึกได้ แต่จะติดธงแดงในชีต') + '</span>' + retry);
      needReason(!noSite);
      done();
    }
    fix.start = locate;
    fix.payload = function () { return { loc: fix.loc, locError: fix.loc ? '' : fix.err, reason: rs.hidden ? '' : rin.value.trim() }; };
    return fix;
  }
  function merge(a, b) { for (var k in b) a[k] = b[k]; return a; }

  /* ---------- แจ้งเตือนสาย: 1 point = 5 นาที · ได้ 6 point ต่องวด (ก่อนกดบันทึก) ---------- */
  function lateWarning(key, overwrite) {
    var p = state && state.period;
    if (key !== 'checkIn' || overwrite || !p || p.off) return '';
    var d = new Date(), late = d.getHours() * 60 + d.getMinutes() - p.start;
    if (late <= 0) return '';
    var pts = Math.ceil(late / p.pointMin), total = (p.pointsBefore || 0) + pts, left = p.quota - total;
    var over = Math.min(pts, Math.max(0, -left));
    return '⚠ สาย ' + late + ' นาที = ' + pts + ' point · งวดนี้รวม ' + total + '/' + p.quota +
      (over ? ' — เกินโควตา ' + over + ' point (หัก ' + Math.min(late, over * p.pointMin) + ' นาที)' : ' · เหลือ ' + left + ' point');
  }

  /* ---------- ตอนเข้า: ตรวจตำแหน่ง ---------- */
  function openArrive(key, overwrite) {
    var box = document.createElement('div');
    var warn = lateWarning(key, overwrite);
    if (warn) { var w = document.createElement('div'); w.className = 'latewarn'; w.textContent = warn; box.appendChild(w); box.style.cssText = 'display:flex;flex-direction:column;gap:12px'; }
    var host = document.createElement('div'); box.appendChild(host);
    var geo = locWidget(host, function (ready) { setOk(ready ? 'บันทึกเวลา ' + nowHM() : 'กำลังหาตำแหน่ง…', !ready); });
    openModal({
      kicker: EVENT[key].toUpperCase() + (overwrite ? ' · แก้เวลา' : ''),
      title: TH[key] + ' — ตรวจตำแหน่ง',
      tone: 'in',
      body: box,
      onOk: function () { doStamp(key, overwrite, merge(geo.payload(), { _warn: warn })); }
    });
    geo.start();
  }

  /** dropdown คำแนะนำ — แสดงเมื่อพิมพ์ตั้งแต่ 2 ตัวอักษร (แทน datalist ที่ไม่ขึ้นบนมือถือ) */
  function suggest(input, source, onPick) {
    var box = document.createElement('div');
    box.className = 'sugg'; box.hidden = true;
    function hide() { box.hidden = true; box.innerHTML = ''; }
    function update() {
      var q = input.value.trim().toLowerCase();
      if (q.length < 2) return hide();
      var a = [], b = [];
      (source() || []).forEach(function (x) {
        var v = String(x), l = v.toLowerCase();
        if (l === q) return;
        if (l.indexOf(q) === 0) a.push(v); else if (l.indexOf(q) > 0) b.push(v);
      });
      var items = a.concat(b).slice(0, 6);
      if (!items.length) return hide();
      box.innerHTML = items.map(function (v) {
        var i = v.toLowerCase().indexOf(q);
        return '<button type="button" data-v="' + esc(v) + '">' + esc(v.slice(0, i)) + '<mark>' + esc(v.slice(i, i + q.length)) + '</mark>' + esc(v.slice(i + q.length)) + '</button>';
      }).join('');
      box.hidden = false;
    }
    box.addEventListener('pointerdown', function (e) {
      var btn = e.target.closest ? e.target.closest('button') : null;
      if (!btn) return;
      e.preventDefault();                                  // ไม่ให้ช่องกรอกหลุดโฟกัสก่อนเลือก
      input.value = btn.dataset.v;
      hide();
      if (onPick) onPick();
    });
    input.addEventListener('input', update);
    input.addEventListener('focus', update);
    input.addEventListener('blur', function () { setTimeout(hide, 150); });
    return box;
  }

  /* ---------- ตอนออก: ตรวจตำแหน่ง + ยอดผลิต ---------- */
  function openLeave(key, overwrite) {
    var wrap = document.createElement('div');
    wrap.innerHTML = '<div class="lbox"></div>' +
      '<div class="cap" style="margin:18px 0 8px">ยอดผลิต</div>' +
      '<div class="pcap"><span>โมเดล</span><span>MC No</span><span>จำนวน</span><span></span></div>' +
      '<div class="prows" style="margin-top:6px"></div>' +
      '<button type="button" class="addrow" style="width:100%;margin-top:10px">+ เพิ่มโมเดล</button>' +
      '<div class="ptotal" style="margin-top:14px"><span>' + (key === 'breakOut' ? 'ยังไม่มีชิ้นงาน เว้นว่างได้' : 'รวมทั้งหมด') + '</span><span><b class="tot">0</b> ชิ้น</span></div>' +
      '<div class="pmsg"></div>';
    var rows = wrap.querySelector('.prows');
    var geo = locWidget(wrap.querySelector('.lbox'), function () { total(); });
    var NUM = ' inputmode="numeric" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"';

    function addRow(model, mc, qty, pre) {
      var r = document.createElement('div');
      r.className = 'prow';
      r.innerHTML = '<div class="pgrid">' +
        '<input class="field model" placeholder="โมเดล" enterkeyhint="next"' + NUM + '>' +
        '<input class="field mc" placeholder="MC" enterkeyhint="next"' + NUM + '>' +
        '<input class="field qty" placeholder="ชิ้น" pattern="[0-9]*" enterkeyhint="done"' + NUM + '>' +
        '<button type="button" class="x" aria-label="ลบแถว">×</button></div>';
      var mi = r.querySelector('.model'), ci = r.querySelector('.mc'), qi = r.querySelector('.qty');
      mi.value = model || ''; ci.value = mc || ''; qi.value = qty != null && qty !== '' ? qty : '';
      if (pre && (mi.value || ci.value)) { r.dataset.pre = '1'; mi.classList.add('pre'); ci.classList.add('pre'); }
      function touched() { if (r.dataset.pre) { r.dataset.pre = ''; mi.classList.remove('pre'); ci.classList.remove('pre'); } total(); }
      r.appendChild(suggest(mi, function () { return state && state.models; }, function () { touched(); ci.focus(); }));
      r.appendChild(suggest(ci, function () { return state && state.machines; }, function () { touched(); qi.focus(); }));
      r.querySelector('.x').addEventListener('click', function () {
        if (rows.children.length > 1) r.remove(); else { mi.value = ''; ci.value = ''; qi.value = ''; touched(); }
        total();
      });
      qi.addEventListener('input', function () { qi.value = qi.value.replace(/[^\d]/g, ''); touched(); });
      mi.addEventListener('input', touched);
      ci.addEventListener('input', touched);
      mi.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); ci.focus(); } });
      ci.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); qi.focus(); } });
      qi.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); qi.blur(); } });
      rows.appendChild(r);
      return r;
    }
    function collect() {
      var items = [], bad = false;
      Array.prototype.forEach.call(rows.children, function (r) {
        var m = r.querySelector('.model').value.trim(), c = r.querySelector('.mc').value.trim(), q = r.querySelector('.qty').value.trim();
        if (r.dataset.pre && q === '') return r.classList.remove('err');   // ค่าล่าสุดที่เติมให้ ยังไม่ได้ใส่จำนวน = ไม่นับ
        var err = (m && !/^\d+$/.test(q)) || (!m && (q !== '' || c !== ''));
        r.classList.toggle('err', !!err);
        if (err) bad = true; else if (m) items.push({ model: m, mc: c, qty: Number(q) });
      });
      return { items: items, bad: bad };
    }
    function total() {
      if (!rows.children.length) return;
      var c = collect();
      wrap.querySelector('.tot').textContent = c.items.reduce(function (a, x) { return a + x.qty; }, 0).toLocaleString();
      wrap.querySelector('.pmsg').textContent = '';
      Array.prototype.forEach.call(rows.children, function (r) { r.classList.remove('err'); });
      if (!geo.ready) return setOk('กำลังหาตำแหน่ง…', true);
      setOk(c.items.length ? 'บันทึกเวลา ' + nowHM() : 'บันทึกเวลา (ไม่มียอด)', false);
    }
    wrap.querySelector('.addrow').addEventListener('click', function () { addRow().querySelector('.model').focus(); });

    var prev = overwrite ? (state.prod || []).filter(function (x) { return x.event === EVENT[key]; }) : [];
    var last = overwrite ? [] : (lsGet(empKey('lastprod')) || []);
    if (prev.length) prev.forEach(function (x) { addRow(x.model, x.mc, x.qty); });
    else if (last.length) last.forEach(function (x) { addRow(x.model, x.mc, '', true); });   // จำโมเดล / MC ล่าสุด (ไม่จำจำนวน)
    else addRow();

    openModal({
      kicker: EVENT[key].toUpperCase() + (overwrite ? ' · แก้เวลา' : ''),
      title: TH[key] + ' — ยอดผลิต',
      tone: 'out',
      body: wrap,
      onOk: function () {
        var c = collect();
        if (c.bad) { wrap.querySelector('.pmsg').textContent = 'กรอกให้ครบทั้งโมเดลและจำนวน (ตัวเลข) หรือลบแถวที่ไม่ใช้'; return; }
        doStamp(key, overwrite, merge({ prod: c.items }, geo.payload()));
      }
    });
    geo.start();
  }

  /* ---------- ยืนยันบันทึกแล้ว: เขียวเต็มจอ แล้วจางหายใน ~2 วินาที ---------- */
  var doneT1 = null, doneT2 = null;
  function showDone(title, time, sub, pills) {
    var el = $('#done');
    $('#doneTitle').textContent = title;
    $('#doneTime').textContent = time;
    $('#doneSub').textContent = sub || '';
    $('#donePills').innerHTML = (pills || []).map(function (p) {
      return '<span class="pill' + (p.warn ? ' warn' : '') + '">' + esc(p.text) + '</span>';
    }).join('<br>');
    clearTimeout(doneT1); clearTimeout(doneT2);
    el.classList.remove('hide'); void el.offsetWidth; el.classList.add('show');
    doneT1 = setTimeout(function () {
      el.classList.add('hide');
      doneT2 = setTimeout(function () { el.classList.remove('show', 'hide'); }, 450);
    }, pills && pills.length ? 2200 : 1550);
  }
  $('#done').addEventListener('click', function () { clearTimeout(doneT1); clearTimeout(doneT2); $('#done').classList.remove('show', 'hide'); });

  /* ---------- บันทึก: แสดงผลทันที แล้วส่งเบื้องหลัง ---------- */
  function doStamp(key, overwrite, extra) {
    var hm = nowHM();
    var warn = extra._warn; delete extra._warn;
    var body = merge({ action: 'stamp', field: key, overwrite: !!overwrite, notes: dirty ? getNotes() : null, at: Date.now(), rid: rid() }, extra);
    var hasSites = !!(state && state.sites && state.sites.length);
    var j = extra.loc ? judge(extra.loc) : null;
    var flag = j && j.status === 'out' ? '⚠ นอกพื้นที่' : (!extra.loc && hasSites ? '⚠ ไม่มีพิกัด' : '');
    queue.push({ rid: body.rid, kind: 'stamp', key: key, hm: hm, date: todayStr(), flag: flag, body: body });
    saveQueue();
    if (extra.prod && extra.prod.length) lsSet(empKey('lastprod'), extra.prod.map(function (x) { return { model: x.model, mc: x.mc }; }));
    dirty = false;
    closeModal();
    show();
    var pcs = (extra.prod || []).reduce(function (a, x) { return a + x.qty; }, 0);
    var pills = [];
    if (flag) pills.push({ text: flag + ' — ติดธงแดงในชีต' });
    if (warn) pills.push({ text: warn, warn: true });
    showDone(TH[key], hm, pcs ? 'บันทึกแล้ว · ยอดผลิต ' + pcs.toLocaleString() + ' ชิ้น' : 'บันทึกแล้ว', pills);
    flush();
  }

  /* ================== tiles ================== */
  function disarm() { armed = null; clearTimeout(armTimer); if (state) render(state); }
  var CONFIRM_EMPTY = ['otIn', 'otOut'];             // OT ต้องแตะ 2 ครั้งเสมอ กันกดพลาด
  function onTile(key) {
    if (busy || !state) return;
    var filled = !!state.times[key];
    if ((filled || CONFIRM_EMPTY.indexOf(key) >= 0) && armed !== key) {
      armed = key; clearTimeout(armTimer);
      armTimer = setTimeout(disarm, 3500);
      render(state);
      return;
    }
    armed = null; clearTimeout(armTimer); render(state);
    if (ARRIVE.indexOf(key) >= 0) openArrive(key, filled); else openLeave(key, filled);
  }

  /* ================== notes ================== */
  function save() {
    document.activeElement && document.activeElement.blur();
    var notes = getNotes();
    queue.push({ rid: rid(), kind: 'notes', date: todayStr(), body: { action: 'saveNotes', notes: notes } });
    saveQueue();
    dirty = false;
    show();
    toast('บันทึก Note แล้ว ✓');
    flush();
  }

  /* ================== wiring ================== */
  tiles.forEach(function (el) { el.addEventListener('click', function () { onTile(el.dataset.key); }); });
  inputs.forEach(function (inp, i) {
    inp.addEventListener('input', function () { dirty = true; renderSave(); });
    inp.addEventListener('keydown', function (ev) {
      if (ev.key !== 'Enter') return;
      ev.preventDefault();
      if (inputs[i + 1]) inputs[i + 1].focus(); else save();
    });
  });
  // iOS เลื่อนหน้าขึ้นตอนคีย์บอร์ดเปิด — พอปิดคีย์บอร์ดให้หน้ากลับที่เดิม
  document.addEventListener('focusout', function () {
    setTimeout(function () {
      var a = document.activeElement;
      if (!a || a.tagName !== 'INPUT') window.scrollTo(0, 0);
    }, 50);
  });
  $('#save').addEventListener('click', save);
  $('#refresh').addEventListener('click', function () { dirty = false; refresh(true); flush(); });
  $('#logout').addEventListener('click', function () {
    var msg = queue.length ? 'ยังมี ' + queue.length + ' รายการที่ยังส่งไม่ถึงระบบ — จะส่งให้อัตโนมัติเมื่อเข้าสู่ระบบครั้งถัดไป\nออกจากระบบ?' : 'ออกจากระบบ?';
    if (window.confirm(msg)) logout();
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { stopGeoWatch(); return; }
    if (!session) return;
    maybeStartGeo();
    flush();
    if (!dirty && !$('#modal').classList.contains('show')) refresh();
  });
  window.addEventListener('online', function () { flush(); });
  setInterval(function () { if (queue.length && !flushing) flush(); }, 15000);

  tick(); setInterval(tick, 1000);
  if (!apiUrl()) showLogin('ผู้ดูแล: ยังไม่ได้ใส่ API_URL ในไฟล์ index.html');
  else if (session) { showApp(); startSession(); }
  else showLogin();
</script>
</body>
</html>
