<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual">
<title>Time Card</title>
<meta name="theme-color" content="#0d0e0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Time Card">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0e0f; --panel: #151719; --line: #2a2e33; --line2: #3a3f45;
    --text: #ecebe7; --muted: #878b90;
    --accent: #ff6b1a; --ok: #4fd18b; --warn: #ffc53d; --err: #ff5a5a; --flag: #ff4d4d;
    --mono: 'Share Tech Mono', ui-monospace, monospace;
    --sans: 'IBM Plex Sans Thai', system-ui, sans-serif;
    --gap: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  button { touch-action: manipulation; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans);
               -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
  body { display: flex; justify-content: center; align-items: center; }
  [hidden] { display: none !important; }

  /* ---------- main app: พอดีหนึ่งจอ ---------- */
  .app { width: 100%; max-width: 460px; height: 100vh; height: 100dvh; max-height: 880px;
         display: flex; flex-direction: column; gap: 12px; overflow: hidden;
         padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
           max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }

  .top { flex: none; display: flex; justify-content: space-between; align-items: center; gap: 16px;
         border-bottom: 1px solid var(--line); padding-bottom: 8px; }
  .top .id { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; color: var(--muted);
             text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top .id b { color: var(--text); font-weight: 400; }
  .top .acts { display: flex; gap: 14px; flex: none; }
  .top button { background: none; border: 0; color: var(--muted); font-family: var(--sans); font-size: 13px;
                cursor: pointer; padding: 2px 0; }
  .top button:hover { color: var(--text); }

  .head { flex: none; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
  .clock { font-family: var(--mono); font-size: clamp(44px, 14vw, 60px); line-height: .9; white-space: nowrap; }
  .clock small { font-size: .4em; color: var(--muted); }
  .meta { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; min-width: 0; }
  .date { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .status { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px; border: 1px solid var(--line);
            border-radius: 999px; font-size: 12px; white-space: nowrap; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .status.on .dot { background: var(--ok); box-shadow: 0 0 0 3px rgba(79,209,139,.18); }
  .status.break .dot { background: var(--warn); }
  .status.ot .dot { background: var(--accent); }

  .label { flex: none; display: flex; justify-content: space-between; align-items: center; gap: 8px;
           font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .label > span:first-child { color: var(--text); font-weight: 500; }
  .hrs { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; white-space: nowrap; }
  .hrs b { color: var(--text); font-weight: 400; }

  .times { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .grid { flex: 1 1 auto; min-height: 0; max-height: 480px; display: grid; gap: var(--gap);
          grid-template-columns: repeat(4, 1fr);
          --free: calc(100vh - 440px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
          grid-template-rows: minmax(84px, 1fr) clamp(58px, calc(var(--free) * .35), 80px); }
  @supports (height: 100dvh) {
    .grid { --free: calc(100dvh - 440px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); }
  }
  .tile { position: relative; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
          padding: 10px 12px; text-align: left; color: var(--text); font: inherit; cursor: pointer;
          display: flex; flex-direction: column; justify-content: flex-start; gap: 2px;
          transition: border-color .15s, background .15s, transform .05s; -webkit-tap-highlight-color: transparent;
          touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .tile:active { transform: scale(.97); }
  .tile.big { grid-column: span 2; padding: 12px 14px; }
  .tile.sm { padding: 8px 9px; }
  .tile .en { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; color: var(--muted); white-space: nowrap; }
  .tile.sm .en { font-size: 10px; letter-spacing: .04em; }
  .tile .th { font-size: 13px; font-weight: 500; }
  .tile .t { font-family: var(--mono); font-size: 19px; color: var(--muted); white-space: nowrap; margin-top: auto; }
  .tile.big .t { font-size: clamp(28px, 9vw, 40px); line-height: 1; }
  .tile .hint { display: none; font-size: 11px; line-height: 1.3; color: var(--warn); font-weight: 500;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile.done { border-color: var(--line2); }
  .tile.done .t { color: var(--text); }
  .tile.primary { background: var(--accent); border-color: var(--accent); color: #111; }
  .tile.primary .en, .tile.primary .t { color: #111; }
  .tile.armed { border-color: var(--warn); background: #2a2412; color: var(--text); }
  .tile.armed .t { color: var(--text); }
  .tile.armed .en { display: none; }
  .tile.armed .hint { display: block; }
  .tile.flag { border-color: rgba(255,77,77,.55); }
  .tile.flag::after { content: ''; position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; border-radius: 50%;
                      background: var(--flag); box-shadow: 0 0 0 3px rgba(255,77,77,.2); }
  .tile:disabled { opacity: .55; cursor: wait; }

  .tasks { flex: none; }
  .save { background: transparent; border: 1px solid var(--line2); color: var(--muted); border-radius: 999px;
          padding: 3px 12px; font: inherit; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .save.dirty { background: var(--text); border-color: var(--text); color: #111; font-weight: 500; }
  .save:disabled { opacity: .55; cursor: wait; }
  .task { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line);
          border-radius: 10px; padding: 0 12px; }
  .task + .task { margin-top: 6px; }
  .task:focus-within { border-color: var(--accent); }
  .task em { font-style: normal; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .task input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--text); font: inherit;
                font-size: 16px; height: 42px; }
  .task input::placeholder, .field::placeholder { color: #5a5e63; }

  /* ---------- shared form bits ---------- */
  .btn { padding: 12px; border-radius: 10px; border: 1px solid var(--line2); background: transparent;
         color: var(--text); font: inherit; font-weight: 500; font-size: 15px; cursor: pointer; }
  .btn.solid { background: var(--accent); border-color: var(--accent); color: #111; }
  .btn:disabled { opacity: .5; cursor: default; }
  .field { width: 100%; height: 46px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
           color: var(--text); font: inherit; font-size: 16px; padding: 0 12px; outline: 0; }
  .field:focus { border-color: var(--accent); }
  .cap { display: block; font-family: var(--mono); font-size: 11px; letter-spacing: .12em; color: var(--muted); margin: 14px 0 6px; }

  /* ---------- login ---------- */
  .login { position: fixed; inset: 0; z-index: 25; background: var(--bg); display: flex; align-items: center; justify-content: center;
           padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); overflow: auto; }
  .login form { width: 100%; max-width: 400px; }
  .login .brand { font-family: var(--mono); font-size: 12px; letter-spacing: .16em; color: var(--muted);
                  border-bottom: 1px solid var(--line); padding-bottom: 10px; }
  .login .clock { margin: 22px 0 6px; }
  .login h1 { font-size: 20px; font-weight: 600; margin: 22px 0 2px; }
  .login p { color: var(--muted); font-size: 13px; }
  .login .btn { width: 100%; margin-top: 18px; height: 50px; }
  .login .msg { min-height: 20px; margin-top: 12px; font-size: 13px; color: var(--err); }

  /* ---------- popup ---------- */
  .modal { position: fixed; inset: 0; z-index: 30; display: none; background: rgba(0,0,0,.62);
           -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
           padding: calc(max(12px, env(safe-area-inset-top)) + 6px) 12px max(12px, env(safe-area-inset-bottom)); }
  .modal.show { display: flex; justify-content: center; align-items: flex-start; }
  .sheet { width: 100%; max-width: 436px; max-height: 100%; overflow: auto; background: var(--panel);
           border: 1px solid var(--line2); border-radius: 16px; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 14px;
           animation: pop .16s ease-out; }
  @keyframes pop { from { transform: translateY(-8px); opacity: 0; } }
  .sheet .kicker { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; color: var(--muted); }
  .sheet h3 { font-size: 19px; font-weight: 600; margin-top: 2px; }
  .sheet .actions { display: flex; gap: 8px; }
  .sheet .actions .btn { flex: 1; height: 50px; }
  .sheet .actions .btn.solid { flex: 1.6; }

  .locbox { border: 1px solid var(--line2); border-radius: 12px; padding: 14px; display: flex; gap: 12px; align-items: flex-start; }
  .locbox .ic { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
                font-size: 17px; font-weight: 600; background: var(--line); }
  .locbox b { display: block; font-size: 15px; font-weight: 600; }
  .locbox span { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; line-height: 1.45; }
  .locbox a { color: var(--muted); font-size: 12px; }
  .locbox.in  { border-color: rgba(79,209,139,.5); }  .locbox.in .ic  { background: rgba(79,209,139,.16); color: var(--ok); }
  .locbox.out { border-color: rgba(255,77,77,.55); }  .locbox.out .ic { background: rgba(255,77,77,.16); color: var(--flag); }
  .locbox.warn { border-color: rgba(255,197,61,.5); } .locbox.warn .ic { background: rgba(255,197,61,.14); color: var(--warn); }
  .spin { width: 18px; height: 18px; border: 2px solid var(--line2); border-top-color: var(--text); border-radius: 50%;
          animation: rot .8s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }
  .linkbtn { background: none; border: 0; color: var(--text); text-decoration: underline; font: inherit; font-size: 13px;
             cursor: pointer; padding: 0; margin-top: 6px; }

  .prows { display: flex; flex-direction: column; gap: 8px; }
  .prow { display: grid; grid-template-columns: 1fr 92px 40px; gap: 6px; }
  .prow .field { padding: 0 10px; }
  .prow .qty { text-align: right; font-family: var(--mono); font-size: 18px; }
  .prow.err .field { border-color: var(--err); }
  .prow .x { height: 46px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--muted);
             font-size: 18px; cursor: pointer; }
  .addrow { height: 44px; border-radius: 10px; border: 1px dashed var(--line2); background: transparent; color: var(--muted);
            font: inherit; font-size: 14px; cursor: pointer; }
  .ptotal { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--muted); }
  .ptotal b { font-family: var(--mono); font-size: 20px; font-weight: 400; color: var(--text); }
  .pmsg { font-size: 13px; color: var(--err); min-height: 0; }

  .toast { position: fixed; left: 50%; top: calc(max(12px, env(safe-area-inset-top)) + 4px); z-index: 40;
           transform: translate(-50%, -20px); opacity: 0; background: var(--text); color: #111; padding: 10px 16px;
           border-radius: 10px; font-size: 14px; transition: all .2s; pointer-events: none; max-width: calc(100% - 32px); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.err { background: var(--err); color: #fff; }
  .toast.warn { background: var(--warn); color: #111; }

  @media (max-width: 370px) {
    .tile.sm { padding: 8px 7px; }
    .tile.sm .en { font-size: 9.5px; letter-spacing: 0; }
    .tile.sm .t { font-size: 17px; }
  }
  @media (max-height: 520px) {
    .app { height: auto; max-height: none; overflow: visible; }
    .times, .grid { flex: none; }
    .grid { grid-template-rows: 84px 58px; }
    body { align-items: flex-start; }
  }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div class="login" id="login" hidden>
  <form id="loginForm" autocomplete="on" novalidate>
    <div class="brand">TIME CARD</div>
    <div class="clock"><span class="lhm">--:--</span><small class="lss">:--</small></div>
    <p class="ldate"></p>
    <h1>เข้าสู่ระบบ</h1>
    <p>ใช้รหัสพนักงานและ PIN ที่ได้รับ</p>
    <label class="cap" for="empId">รหัสพนักงาน</label>
    <input class="field" id="empId" name="username" autocomplete="username" autocapitalize="characters" spellcheck="false" required>
    <label class="cap" for="pin">PIN</label>
    <input class="field" id="pin" name="password" type="password" inputmode="numeric" autocomplete="current-password" required>
    <button class="btn solid" type="submit" id="loginBtn">เข้าสู่ระบบ</button>
    <div class="msg" id="loginMsg"></div>
  </form>
</div>

<!-- ============ MAIN ============ -->
<main class="app" id="app" hidden>
  <div class="top">
    <span class="id">Time Card · <b id="empName">—</b></span>
    <span class="acts"><button id="refresh">รีเฟรช</button><button id="logout">ออกจากระบบ</button></span>
  </div>

  <div class="head">
    <div class="clock"><span id="hm">--:--</span><small id="ss">:--</small></div>
    <div class="meta">
      <div class="date" id="today"></div>
      <div class="status" id="status"><span class="dot"></span><span id="statusText">กำลังโหลด…</span></div>
    </div>
  </div>

  <section class="times">
    <div class="label"><span>บันทึกเวลา</span><span class="hrs">WORK <b id="workHr">0.00</b> · OT <b id="otHr">0.00</b><span id="pcsWrap" hidden> · <b id="pcs">0</b> PCS</span></span></div>
    <div class="grid">
      <button class="tile big" data-key="checkIn"><span class="en">CHECK IN</span><span class="hint">แตะอีกครั้งเพื่อแก้เวลา</span><span class="th">เข้างาน</span><span class="t">--:--</span></button>
      <button class="tile big" data-key="checkOut"><span class="en">CHECK OUT</span><span class="hint">แตะอีกครั้งเพื่อแก้เวลา</span><span class="th">ออกงาน</span><span class="t">--:--</span></button>
      <button class="tile sm" data-key="breakOut"><span class="en">BREAK OUT</span><span class="hint">แตะอีกครั้ง</span><span class="t">--:--</span></button>
      <button class="tile sm" data-key="breakIn"><span class="en">BREAK IN</span><span class="hint">แตะอีกครั้ง</span><span class="t">--:--</span></button>
      <button class="tile sm" data-key="otIn"><span class="en">OT IN</span><span class="hint">แตะอีกครั้ง</span><span class="t">--:--</span></button>
      <button class="tile sm" data-key="otOut"><span class="en">OT OUT</span><span class="hint">แตะอีกครั้ง</span><span class="t">--:--</span></button>
    </div>
  </section>

  <section class="tasks">
    <div class="label"><span>วันนี้ทำอะไร</span><button class="save" id="save" title="ถ้าไม่ได้กด ระบบจะบันทึกให้อัตโนมัติตอนกดลงเวลา">บันทึก</button></div>
    <label class="task"><em>01</em><input id="t0" list="sugg" placeholder="เช่น CMM Calibration" autocomplete="off" enterkeyhint="next"></label>
    <label class="task"><em>02</em><input id="t1" list="sugg" placeholder="งานที่ 2 (ถ้ามี)" autocomplete="off" enterkeyhint="next"></label>
    <label class="task"><em>03</em><input id="t2" list="sugg" placeholder="งานที่ 3 (ถ้ามี)" autocomplete="off" enterkeyhint="done"></label>
    <datalist id="sugg"></datalist>
    <datalist id="modelList"></datalist>
  </section>
</main>

<!-- ============ POPUP ============ -->
<div class="modal" id="modal">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div><div class="kicker" id="mKicker"></div><h3 id="mTitle"></h3></div>
    <div id="mBody"></div>
    <div class="actions">
      <button class="btn" type="button" id="mCancel">ยกเลิก</button>
      <button class="btn solid" type="button" id="mOk">บันทึกเวลา</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  /* ================== CONFIG ================== */
  // ← ใส่ Web app URL ของ Apps Script (ลงท้ายด้วย /exec)
  var API_URL = 'https://script.google.com/macros/s/AKfycbzHAtrQ5fk6w2oRMx8eUUv0KKVwtx6z4W48wzmCuXzESpNnkhLGwCeLXs6Bny4BQwZPqQ/exec';

  /* ================== constants ================== */
  var ARRIVE = ['checkIn', 'breakIn', 'otIn'];      // ตอนเข้า → เช็คพิกัด
  var EVENT = { checkIn: 'Check In', breakOut: 'Break Out', breakIn: 'Break In', checkOut: 'Check Out', otIn: 'OT In', otOut: 'OT Out' };
  var TH = { checkIn: 'เข้างาน', breakOut: 'พักเบรก', breakIn: 'กลับจากเบรก', checkOut: 'ออกงาน', otIn: 'เริ่ม OT', otOut: 'เลิก OT' };

  var state = null, armed = null, armTimer = null, busy = false, dirty = false;
  var $ = function (s) { return document.querySelector(s); };
  var tiles = Array.prototype.slice.call(document.querySelectorAll('.tile'));
  var inputs = [$('#t0'), $('#t1'), $('#t2')];

  function pad(n) { return ('0' + n).slice(-2); }
  function fmt(v) {
    if (!v) return '--:--';
    var p = String(v).split(':');
    return p.length >= 2 ? pad(Number(p[0])) + ':' + p[1] : v;
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function errMsg(e) { return (e && e.message) ? e.message : String(e); }
  function nowHM() { var d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }

  /* ================== session (localStorage + cookie สำรอง) ================== */
  var SKEY = 'timecard.session';
  function b64e(s) { return btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
  function b64d(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return decodeURIComponent(escape(atob(s))); }
  function loadSession() {
    try { var j = JSON.parse(localStorage.getItem(SKEY)); if (j && j.token) return j; } catch (e) {}
    try { var m = document.cookie.match(/(?:^|; )tcs=([^;]+)/); if (m) { var c = JSON.parse(b64d(m[1])); if (c && c.token) return c; } } catch (e) {}
    return null;
  }
  function saveSession(s) {
    try { if (s) localStorage.setItem(SKEY, JSON.stringify(s)); else localStorage.removeItem(SKEY); } catch (e) {}
    try { document.cookie = 'tcs=' + (s ? b64e(JSON.stringify(s)) : '') + '; Max-Age=' + (s ? 34560000 : 0) + '; Path=/; SameSite=Lax; Secure'; } catch (e) {}
  }
  var session = loadSession();

  function apiUrl() {
    if (/^https:\/\/script\.google\.com\/.+\/exec\/?$/.test(API_URL)) return API_URL;
    try { var old = JSON.parse(localStorage.getItem('timecard.cfg')); if (old && old.url) return old.url; } catch (e) {} // ค่าจากเวอร์ชันเก่า
    return '';
  }

  /* ================== API ================== */
  function api(body) {
    var url = apiUrl();
    if (!url) return Promise.reject(new Error('ยังไม่ได้ใส่ API_URL ในไฟล์ index.html'));
    if (body.action !== 'login') body.token = session && session.token;
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body),
      redirect: 'follow'
    }).then(function (r) {
      return r.text().then(function (txt) { return { status: r.status, txt: txt }; });
    }, function () {
      throw new Error('เชื่อมต่อไม่ได้ — ตรวจอินเทอร์เน็ต หรือการ Deploy (Who has access: Anyone)');
    }).then(function (x) {
      var d;
      try { d = JSON.parse(x.txt); } catch (e) {
        if (/doPost/.test(x.txt)) throw new Error('Apps Script ยังเป็นโค้ดเก่า — วาง Code.gs ใหม่ แล้ว Deploy เป็น New version');
        throw new Error('API ตอบกลับไม่ใช่ JSON (HTTP ' + x.status + ')');
      }
      if (d.error === 'unauthorized') { logout('กรุณาเข้าสู่ระบบอีกครั้ง'); throw new Error('ต้องเข้าสู่ระบบใหม่'); }
      if (d.error) throw new Error(d.error);
      return d;
    });
  }

  /* ================== toast ================== */
  function toast(msg, kind) {
    var t = $('#toast');
    t.textContent = msg;
    t.className = 'toast show' + (kind ? ' ' + kind : '');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.className = 'toast'; }, kind ? 5500 : 2400);
  }

  /* ================== clock ================== */
  function tick() {
    var d = new Date(), hm = pad(d.getHours()) + ':' + pad(d.getMinutes()), ss = ':' + pad(d.getSeconds());
    var date = d.toLocaleDateString('th-TH', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
    $('#hm').textContent = hm; $('#ss').textContent = ss; $('#today').textContent = date;
    $('.lhm').textContent = hm; $('.lss').textContent = ss; $('.ldate').textContent = date;
  }

  /* ================== render ================== */
  function statusOf(t) {
    if (t.otIn && !t.otOut) return ['ot', 'กำลังทำ OT'];
    if (t.checkOut || t.otOut) return ['', 'เลิกงานแล้ว'];
    if (t.breakOut && !t.breakIn) return ['break', 'พักเบรก'];
    if (t.checkIn) return ['on', 'กำลังทำงาน'];
    return ['', 'ยังไม่เข้างาน'];
  }

  function renderSave() {
    var hasTasks = state && (state.tasks || []).some(function (x) { return x; });
    $('#save').classList.toggle('dirty', dirty);
    $('#save').textContent = !dirty && hasTasks ? 'บันทึกแล้ว ✓' : 'บันทึก';
    $('#save').disabled = busy;
  }

  function fillList(id, arr) {
    $(id).innerHTML = (arr || []).map(function (x) { return '<option value="' + esc(x) + '">'; }).join('');
  }

  function render(s) {
    state = s;
    var t = s.times, f = s.flags || {};
    var primary = !t.checkIn ? 'checkIn'
      : (t.breakOut && !t.breakIn && !t.checkOut) ? 'breakIn'
      : (t.otIn && !t.otOut) ? 'otOut'
      : !t.checkOut ? 'checkOut' : null;
    tiles.forEach(function (el) {
      var k = el.dataset.key;
      el.querySelector('.t').textContent = fmt(t[k]);
      el.classList.toggle('done', !!t[k]);
      el.classList.toggle('primary', k === primary && armed !== k);
      el.classList.toggle('armed', armed === k);
      el.classList.toggle('flag', !!f[k]);
      el.title = f[k] || '';
      el.disabled = busy;
    });
    var st = statusOf(t);
    $('#status').className = 'status ' + st[0];
    $('#statusText').textContent = st[1];
    $('#workHr').textContent = s.workHr || '0.00';
    $('#otHr').textContent = s.otHr || '0.00';
    var pcs = (s.prod || []).reduce(function (a, x) { return a + (Number(x.qty) || 0); }, 0);
    $('#pcsWrap').hidden = !pcs;
    $('#pcs').textContent = pcs.toLocaleString();
    if (s.emp) $('#empName').textContent = s.emp.name;
    if (!dirty) inputs.forEach(function (inp, i) { inp.value = s.tasks[i] || ''; });
    fillList('#sugg', s.suggestions);
    fillList('#modelList', s.models);
    renderSave();
  }

  function setBusy(b) { busy = b; if (state) render(state); else renderSave(); }
  function getTasks() { return inputs.map(function (i) { return i.value.trim(); }); }

  function load() {
    setBusy(true);
    return api({ action: 'state' }).then(function (d) { busy = false; render(d.state); })
      .catch(function (e) { setBusy(false); if (session) toast('โหลดข้อมูลไม่สำเร็จ: ' + errMsg(e), 'err'); });
  }

  /* ================== login / logout ================== */
  function showLogin(msg) {
    $('#app').hidden = true;
    $('#login').hidden = false;
    $('#loginMsg').textContent = msg || '';
    try { $('#empId').value = localStorage.getItem('timecard.lastEmp') || ''; } catch (e) {}
    setTimeout(function () { ($('#empId').value ? $('#pin') : $('#empId')).focus(); }, 50);
  }
  function showApp() {
    $('#login').hidden = true;
    $('#app').hidden = false;
    if (session && session.emp) $('#empName').textContent = session.emp.name;
  }
  function logout(msg) {
    session = null; state = null; dirty = false;
    saveSession(null);
    closeModal();
    $('#pin').value = '';
    showLogin(msg);
  }

  $('#loginForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var id = $('#empId').value.trim(), pin = $('#pin').value.trim();
    if (!id || !pin) { $('#loginMsg').textContent = 'กรอกรหัสพนักงานและ PIN'; return; }
    $('#loginBtn').disabled = true; $('#loginBtn').textContent = 'กำลังเข้าสู่ระบบ…'; $('#loginMsg').textContent = '';
    api({ action: 'login', empId: id, pin: pin }).then(function (d) {
      session = { token: d.token, emp: d.emp };
      saveSession(session);
      try { localStorage.setItem('timecard.lastEmp', d.emp.id); } catch (e) {}
      $('#pin').value = '';
      showApp();
      load();
    }).catch(function (e) {
      $('#loginMsg').textContent = errMsg(e);
    }).then(function () {
      $('#loginBtn').disabled = false; $('#loginBtn').textContent = 'เข้าสู่ระบบ';
    });
  });

  /* ================== popup ================== */
  var modal = { onOk: null };
  function openModal(o) {
    $('#mKicker').textContent = o.kicker || '';
    $('#mTitle').textContent = o.title;
    $('#mBody').innerHTML = '';
    $('#mBody').appendChild(o.body);
    setOk(o.okText || 'บันทึกเวลา', false);
    modal.onOk = o.onOk;
    $('#toast').className = 'toast'; // ไม่ให้ข้อความเก่าบังหัวหน้าต่าง
    $('#modal').classList.add('show');
  }
  function closeModal() { $('#modal').classList.remove('show'); modal.onOk = null; }
  function setOk(text, disabled) { $('#mOk').textContent = text; $('#mOk').disabled = !!disabled; }
  $('#mCancel').addEventListener('click', closeModal);
  $('#modal').addEventListener('click', function (ev) { if (ev.target === $('#modal') && !$('#mOk').disabled) closeModal(); });
  $('#mOk').addEventListener('click', function () { if (modal.onOk) modal.onOk(); });

  /* ---------- ตอนเข้า: ตรวจพิกัด ---------- */
  function dist(a, b, c, d) {
    var R = 6371000, r = Math.PI / 180, x = (c - a) * r, y = (d - b) * r;
    var h = Math.sin(x / 2) * Math.sin(x / 2) + Math.cos(a * r) * Math.cos(c * r) * Math.sin(y / 2) * Math.sin(y / 2);
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
  }
  function fmtDist(m) { return m >= 1000 ? (m / 1000).toFixed(1) + ' กม.' : Math.round(m) + ' ม.'; }
  function judge(loc) {
    var sites = (state && state.sites) || [];
    if (!sites.length) return { status: 'nosite' };
    var best = null;
    sites.forEach(function (s) { var d = dist(loc.lat, loc.lng, s.lat, s.lng); if (!best || d < best.dist) best = { site: s.name, dist: d, radius: s.radius }; });
    best.status = best.dist - Math.min(loc.acc || 0, 150) <= best.radius ? 'in' : 'out';
    return best;
  }
  function geoError(e) {
    if (!e) return 'อุปกรณ์ไม่รองรับการหาตำแหน่ง';
    if (e.code === 1) return 'ไม่ได้อนุญาตให้เข้าถึงตำแหน่ง';
    if (e.code === 3) return 'หาตำแหน่งนานเกินไป';
    return 'หาตำแหน่งไม่ได้';
  }

  function openArrive(key, overwrite) {
    var box = document.createElement('div');
    var fix = { loc: null, err: '' };
    openModal({
      kicker: EVENT[key].toUpperCase() + (overwrite ? ' · แก้เวลา' : ''),
      title: TH[key] + ' — ตรวจตำแหน่ง',
      body: box,
      onOk: function () { doStamp(key, overwrite, { loc: fix.loc, locError: fix.loc ? '' : fix.err }); }
    });

    function show(cls, icon, title, sub, extra) {
      box.className = 'locbox ' + cls;
      box.innerHTML = '<div class="ic">' + icon + '</div><div><b>' + esc(title) + '</b><span>' + sub + '</span>' + (extra || '') + '</div>';
      var rb = box.querySelector('.retry');
      if (rb) rb.addEventListener('click', locate);
    }
    function locate() {
      fix.loc = null; fix.err = '';
      setOk('กำลังหาตำแหน่ง…', true);
      show('', '<div class="spin"></div>', 'กำลังหาตำแหน่ง…', 'กรุณาอนุญาตการเข้าถึงตำแหน่งถ้ามีหน้าต่างถาม');
      if (!navigator.geolocation) return fail(null);
      navigator.geolocation.getCurrentPosition(ok, fail, { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 });
    }
    function ok(p) {
      if (!$('#modal').classList.contains('show')) return;
      fix.loc = { lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy || 0) };
      var j = judge(fix.loc);
      var map = '<a href="https://maps.google.com/?q=' + fix.loc.lat + ',' + fix.loc.lng + '" target="_blank" rel="noopener">ดูตำแหน่งบนแผนที่</a>';
      var accTxt = 'ความแม่นยำ ±' + fix.loc.acc + ' ม.';
      if (j.status === 'in') show('in', '✓', 'อยู่ในพื้นที่ · ' + j.site, 'ห่าง ' + fmtDist(j.dist) + ' · ' + accTxt, map);
      else if (j.status === 'out') show('out', '!', 'อยู่นอกพื้นที่', 'ห่าง ' + fmtDist(j.dist) + ' จาก ' + esc(j.site) + ' · ' + accTxt + '<br>บันทึกได้ แต่จะติดธงแดงในชีต', map + ' · <button type="button" class="linkbtn retry">หาตำแหน่งใหม่</button>');
      else show('', '•', 'ได้ตำแหน่งแล้ว', accTxt + '<br>ยังไม่ได้ตั้งพิกัดโรงงาน — บันทึกได้ตามปกติ', map);
      setOk('บันทึกเวลา ' + nowHM(), false);
    }
    function fail(e) {
      if (!$('#modal').classList.contains('show')) return;
      fix.err = geoError(e);
      var noSite = !(state && state.sites && state.sites.length);
      show('warn', '!', fix.err,
        e && e.code === 1 ? 'เปิดได้ที่ ตั้งค่า › ความเป็นส่วนตัว › บริการหาตำแหน่ง › Safari' : 'ลองออกไปที่โล่ง หรือกดหาตำแหน่งใหม่',
        '<span>' + (noSite ? 'บันทึกได้ตามปกติ' : 'บันทึกได้ แต่จะติดธงแดงในชีต') + '</span><button type="button" class="linkbtn retry">หาตำแหน่งใหม่</button>');
      setOk('บันทึกเวลา ' + nowHM(), false);
    }
    locate();
  }

  /* ---------- ตอนออก: ยอดผลิต ---------- */
  function openLeave(key, overwrite) {
    var wrap = document.createElement('div');
    wrap.innerHTML = '<div class="prows"></div>' +
      '<button type="button" class="addrow" style="width:100%;margin-top:8px">+ เพิ่มโมเดล</button>' +
      '<div class="ptotal" style="margin-top:12px"><span>' + (key === 'breakOut' ? 'ยังไม่มีชิ้นงาน เว้นว่างได้' : 'รวมทั้งหมด') + '</span><span><b class="tot">0</b> ชิ้น</span></div>' +
      '<div class="pmsg"></div>';
    var rows = wrap.querySelector('.prows');

    function addRow(model, qty) {
      var r = document.createElement('div');
      r.className = 'prow';
      r.innerHTML = '<input class="field model" list="modelList" placeholder="โมเดล" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="next">' +
        '<input class="field qty" inputmode="numeric" pattern="[0-9]*" placeholder="จำนวน" autocomplete="off" enterkeyhint="done">' +
        '<button type="button" class="x" aria-label="ลบแถว">×</button>';
      r.querySelector('.model').value = model || '';
      r.querySelector('.qty').value = qty != null && qty !== '' ? qty : '';
      r.querySelector('.x').addEventListener('click', function () {
        if (rows.children.length > 1) r.remove(); else { r.querySelector('.model').value = ''; r.querySelector('.qty').value = ''; }
        total();
      });
      r.querySelector('.qty').addEventListener('input', function (e) { e.target.value = e.target.value.replace(/[^\d]/g, ''); total(); });
      r.querySelector('.model').addEventListener('input', total);
      r.querySelector('.model').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); r.querySelector('.qty').focus(); } });
      r.querySelector('.qty').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } });
      rows.appendChild(r);
      return r;
    }
    function collect() {
      var items = [], bad = false;
      Array.prototype.forEach.call(rows.children, function (r) {
        var m = r.querySelector('.model').value.trim(), q = r.querySelector('.qty').value.trim();
        var err = (m && !/^\d+$/.test(q)) || (!m && q !== '');
        r.classList.toggle('err', !!err);
        if (err) bad = true; else if (m) items.push({ model: m, qty: Number(q) });
      });
      return { items: items, bad: bad };
    }
    function total() {
      var c = collect();
      wrap.querySelector('.tot').textContent = c.items.reduce(function (a, x) { return a + x.qty; }, 0).toLocaleString();
      wrap.querySelector('.pmsg').textContent = '';
      Array.prototype.forEach.call(rows.children, function (r) { r.classList.remove('err'); });
      setOk(c.items.length ? 'บันทึกเวลา ' + nowHM() : 'บันทึกเวลา (ไม่มียอด)', false);
    }
    wrap.querySelector('.addrow').addEventListener('click', function () { addRow().querySelector('.model').focus(); });

    var prev = overwrite ? (state.prod || []).filter(function (x) { return x.event === EVENT[key]; }) : [];
    if (prev.length) prev.forEach(function (x) { addRow(x.model, x.qty); }); else addRow();

    openModal({
      kicker: EVENT[key].toUpperCase() + (overwrite ? ' · แก้เวลา' : ''),
      title: TH[key] + ' — ยอดผลิต',
      body: wrap,
      onOk: function () {
        var c = collect();
        if (c.bad) { wrap.querySelector('.pmsg').textContent = 'กรอกให้ครบทั้งโมเดลและจำนวน (ตัวเลข) หรือลบแถวที่ไม่ใช้'; return; }
        doStamp(key, overwrite, { prod: c.items });
      }
    });
    total();
  }

  /* ---------- บันทึก ---------- */
  function doStamp(key, overwrite, extra) {
    setOk('กำลังบันทึก…', true);
    $('#mCancel').disabled = true;
    var body = { action: 'stamp', field: key, overwrite: !!overwrite, tasks: dirty ? getTasks() : null };
    for (var k in extra) body[k] = extra[k];
    setBusy(true);
    api(body).then(function (r) {
      busy = false;
      closeModal();
      if (r.ok) dirty = false;
      render(r.state);
      if (!r.ok) return toast('มีเวลาบันทึกไว้แล้ว', 'err');
      var t = TH[key] + ' ' + fmt(r.state.times[key]) + ' ✓';
      if (r.check && r.check.status === 'out') toast(t + ' — นอกพื้นที่ ติดธงแดง', 'warn');
      else if (r.check && r.check.status === 'noloc') toast(t + ' — ไม่มีพิกัด ติดธงแดง', 'warn');
      else toast(t + (extra.prod && extra.prod.length ? ' · ' + extra.prod.reduce(function (a, x) { return a + x.qty; }, 0).toLocaleString() + ' ชิ้น' : ''));
    }).catch(function (e) {
      setBusy(false);
      setOk('ลองบันทึกอีกครั้ง', false);
      toast('บันทึกไม่สำเร็จ: ' + errMsg(e), 'err');
    }).then(function () { $('#mCancel').disabled = false; });
  }

  /* ================== tiles ================== */
  function disarm() { armed = null; clearTimeout(armTimer); if (state) render(state); }
  function onTile(key) {
    if (busy || !state) return;
    var filled = !!state.times[key];
    if (filled && armed !== key) {
      armed = key; clearTimeout(armTimer);
      armTimer = setTimeout(disarm, 3500);
      render(state);
      return;
    }
    armed = null; clearTimeout(armTimer); render(state);
    if (ARRIVE.indexOf(key) >= 0) openArrive(key, filled); else openLeave(key, filled);
  }

  /* ================== tasks ================== */
  function save() {
    if (busy) return;
    document.activeElement && document.activeElement.blur();
    setBusy(true);
    api({ action: 'saveTasks', tasks: getTasks() }).then(function (r) {
      dirty = false; busy = false;
      render(r.state);
      toast('บันทึกรายละเอียดแล้ว ✓');
    }).catch(function (e) {
      setBusy(false);
      toast('บันทึกไม่สำเร็จ: ' + errMsg(e), 'err');
    });
  }

  /* ================== wiring ================== */
  tiles.forEach(function (el) { el.addEventListener('click', function () { onTile(el.dataset.key); }); });
  inputs.forEach(function (inp, i) {
    inp.addEventListener('input', function () { dirty = true; renderSave(); });
    inp.addEventListener('keydown', function (ev) {
      if (ev.key !== 'Enter') return;
      ev.preventDefault();
      if (inputs[i + 1]) inputs[i + 1].focus(); else save();
    });
  });
  // iOS เลื่อนหน้าขึ้นตอนคีย์บอร์ดเปิด — พอปิดคีย์บอร์ดให้หน้ากลับที่เดิม
  document.addEventListener('focusout', function () {
    setTimeout(function () {
      var a = document.activeElement;
      if (!a || a.tagName !== 'INPUT') window.scrollTo(0, 0);
    }, 50);
  });
  $('#save').addEventListener('click', save);
  $('#refresh').addEventListener('click', function () { dirty = false; load(); });
  $('#logout').addEventListener('click', function () { if (window.confirm('ออกจากระบบ?')) logout(); });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && session && !busy && !dirty && !$('#modal').classList.contains('show')) load();
  });

  tick(); setInterval(tick, 1000);
  if (!apiUrl()) showLogin('ผู้ดูแล: ยังไม่ได้ใส่ API_URL ในไฟล์ index.html');
  else if (session) { showApp(); load(); }
  else showLogin();
</script>
</body>
</html>
